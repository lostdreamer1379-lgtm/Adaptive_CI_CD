# Deploy with: fly launch --now  (from inside the relay/ folder)
app = "adaptive-cicd-relay"  # fly will ask you to rename if taken
primary_region = "iad"

[build]

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
